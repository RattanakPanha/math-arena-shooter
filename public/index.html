<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math Arena Shooter</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="joinScreen" class="panel">
      <h1>Math Arena</h1>
      <form id="joinForm">
        <label for="nameInput">Enter your player name</label>
        <input id="nameInput" type="text" maxlength="18" placeholder="Player name" value="Player" />
        <button type="submit">Enter Match</button>
      </form>
    </div>

    <div id="gameWrap" hidden>
      <div class="topbar">
        <div class="stat">
          <span>Round</span>
          <strong id="roundValue">1</strong>
        </div>
        <div class="stat">
          <span>Timer</span>
          <strong id="timerValue">45</strong>
        </div>
        <div class="stat">
          <span>Level</span>
          <strong id="levelValue">1</strong>
        </div>
        <div class="stat">
          <span>Rank</span>
          <strong id="rankValue">Rookie</strong>
        </div>
      </div>

      <div class="game-shell">
        <canvas id="gameCanvas" width="1600" height="900"></canvas>

        <div class="side-panel">
          <div class="box">
            <h3>Weapons</h3>
            <div class="weapon-buttons">
              <button class="weaponButton" data-weapon="pistol">1. Pistol</button>
              <button class="weaponButton" data-weapon="smg">2. SMG</button>
              <button class="weaponButton" data-weapon="rifle">3. Rifle</button>
              <button class="weaponButton" data-weapon="shotgun">4. Shotgun</button>
              <button class="weaponButton" data-weapon="blaster" style="grid-column: 1 / -1;">5. Blaster</button>
            </div>
          </div>

          <div class="box">
            <h3>Math Challenge</h3>
            <div id="mathProgress">0 / 3 solved</div>
            <div id="mathQuestion">Waiting for question...</div>
            <form id="answerForm">
              <input id="answerInput" type="number" step="any" placeholder="Your answer" />
              <button type="submit">Submit Answer</button>
            </form>
            <div id="feedback"></div>
          </div>

          <div class="box">
            <h3>Leaderboard</h3>
            <ol id="leaderboardList"></ol>
          </div>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/script.js"></script>
  </body>
</html>
